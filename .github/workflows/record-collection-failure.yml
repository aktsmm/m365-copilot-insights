name: Record collection failure

on:
  workflow_run:
    workflows: ["Private calendar collection", "Audit aggregate collection"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      REPO: ${{ github.repository }}
    steps:
      - name: Open or update a failure issue (names only, no private data)
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion=="failure") | (.name + " / " + ([.steps[] | select(.conclusion=="failure") | .name] | join(", ")))] | join("; ")')
          title="Collection failure: $WF_NAME"
          body="- Time (UTC): $(date -u +%Y-%m-%dT%H:%MZ)
          - Result: $CONCLUSION
          - Failed job / step: ${failed:-unknown}
          - Run: $RUN_URL

          Only workflow-defined step names are recorded. Private data and logs are never copied here. See docs/operations-notes.md (Troubleshooting a failed collection)."
          body=$(printf '%s' "$body" | sed 's/^          //')
          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
