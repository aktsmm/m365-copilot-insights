name: Audit aggregate collection
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'
permissions: {}
concurrency:
  group: copilot-audit-aggregate
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.repository == 'aktsmm/m365-copilot-insights' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TENANT_ID: ${{ vars.TENANT_ID }}
      AUDIT_CLIENT_ID: ${{ vars.AUDIT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Aggregate Copilot audit log (no user names)
        shell: pwsh
        run: ./scripts/Invoke-CopilotAuditAggregate.ps1 -TenantId $env:TENANT_ID -AuditClientId $env:AUDIT_CLIENT_ID
